<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The latest news, announcements, and stories from Northern Lights Media at NKU." />
    <title>News | Northern Lights Media</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="Assets/NL_Iso_B.png" />
    <link rel="stylesheet" href="styles.css?v=gallery3d" />
    <link rel="stylesheet" href="community.css" />
    <script type="module" src="components/navbar.js?v=gallery3d"></script>
    <script type="module" src="components/notion-feed.js"></script>
  </head>
  <body>
    <header id="site-nav"></header>
    <main class="community-page">
      <header class="community-heading">
        <p class="community-eyebrow">Northern Lights Media / The latest</p>
        <h1>News &amp; stories</h1>
        <p>Fresh ideas, club updates, and stories from our corner of the DFX community.</p>
      </header>
      <section data-notion-feed="news" aria-label="News articles" aria-busy="true">
        <p class="feed-status" data-feed-status role="status">Loading news...</p>
        <button class="feed-retry" data-feed-retry type="button" hidden>Try again</button>
        <div data-feed-results></div>
      </section>
      <noscript><p>Enable JavaScript to load published news articles.</p></noscript>
    </main>
  </body>
</html>
